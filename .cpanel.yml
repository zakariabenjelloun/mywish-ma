---
# ═══════════════════════════════════════════════════════════════════
# .cpanel.yml — MyWish.ma deployment script
# ═══════════════════════════════════════════════════════════════════
# Single-branch workflow: only `main` → /home/casaeucx/mywish.allocantine.ma/
# Runs automatically on "Deploy HEAD Commit" in cPanel Git Version Control.
# ═══════════════════════════════════════════════════════════════════

deployment:
  tasks:
    - export DEPLOYPATH=/home/casaeucx/mywish.allocantine.ma

    # ─────────────────────────────────────────
    # 1. Ensure target subdirectories exist
    #    (mkdir -p is idempotent — safe on every deploy)
    # ─────────────────────────────────────────
    - /bin/mkdir -p $DEPLOYPATH/src
    - /bin/mkdir -p $DEPLOYPATH/database
    - /bin/mkdir -p $DEPLOYPATH/storage/logs
    - /bin/mkdir -p $DEPLOYPATH/storage/cache
    - /bin/mkdir -p $DEPLOYPATH/storage/uploads

    # ─────────────────────────────────────────
    # 2. Copy CONTENTS using the "/." pattern.
    #    The trailing "/." tells cp to copy entries INTO the target dir
    #    (instead of nesting). Recurses into new subdirs automatically
    #    (src/Models/, src/Controllers/AuthController.php, etc.).
    #    -p preserves source file modes/timestamps.
    # ─────────────────────────────────────────
    - /bin/cp -Rp public/. $DEPLOYPATH/
    - /bin/cp -Rp src/. $DEPLOYPATH/src/
    - /bin/cp -Rp database/. $DEPLOYPATH/database/

    # ─────────────────────────────────────────
    # 3. Permissions — SCOPED to deployed code only.
    #    Never chmod $DEPLOYPATH root: .env, error_log, cgi-bin live
    #    there and must keep their existing permissions (.env stays 600).
    # ─────────────────────────────────────────
    - /bin/chmod 644 $DEPLOYPATH/index.php $DEPLOYPATH/.htaccess
    - /bin/find $DEPLOYPATH/assets $DEPLOYPATH/src $DEPLOYPATH/database -type f -exec chmod 644 {} \;
    - /bin/find $DEPLOYPATH/assets $DEPLOYPATH/src $DEPLOYPATH/database -type d -exec chmod 755 {} \;
    - /bin/chmod -R 775 $DEPLOYPATH/storage

    # ─────────────────────────────────────────
    # 4. Deployment marker
    # ─────────────────────────────────────────
    - /bin/date > $DEPLOYPATH/.last-deploy.txt
